<!DOCTYPE html>
<html>
<head>
    <title>Hover Effect</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        .btn {
            background-color: blue;
            color: white;
            padding: 15px 30px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: red;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <button class="btn">Hover Me</button>

</body>
</html>
